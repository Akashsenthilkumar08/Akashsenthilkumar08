<svg xmlns="http://www.w3.org/2000/svg" width="293" height="174" viewBox="0 0 293 174"><style>
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}} @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes sheen{0%{transform:translateX(-240px) skewX(-20deg)}30%,100%{transform:translateX(520px) skewX(-20deg)}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.f{opacity:0;animation:fade .9s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.sh{animation:sheen 5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.r,.f,.g,.pulse,.sh{animation:none!important;opacity:1!important;transform:none!important}.sh{display:none}}
</style><rect width="293" height="174" rx="14" fill="#f3f3f1"/><rect x="22" y="28" width="8" height="8" rx="2" fill="#2f55ff"/>
    <text class="r" x="42" y="38" font-family="Arial" font-size="17" font-weight="600" fill="#111111">RescueVoice</text>
    <text x="22" y="76" font-family="Arial" font-size="13" fill="#3a3a3c">Real-time interruption-aware voice agent w</text>
    <text x="22" y="97" font-family="Arial" font-size="13" fill="#3a3a3c">ith multi-model speech recognition</text>
    <text x="22" y="150" font-family="monospace" font-size="11" fill="#6e6e73">TypeScript</text></svg>