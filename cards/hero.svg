<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
<style>
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.ascii{font-family:"Courier New",monospace;font-size:6px;letter-spacing:0;white-space:pre;fill:#a3a3a3;opacity:0;animation:fade 1.5s ease forwards}
@media(prefers-reduced-motion:reduce){.r,.ascii{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect width="880" height="420" rx="14" fill="#f3f3f1"/>
<rect x="42" y="45" width="8" height="8" rx="2" fill="#2f55ff"/>
<text x="60" y="53" font-family="monospace" font-size="11" letter-spacing="1" fill="#6e6e73">COMPUTER SCIENCE STUDENT · DEVELOPER</text>
<text class="r" x="42" y="174" font-family="Georgia,serif" font-size="91" letter-spacing="-3" fill="#111111">Akash</text>
<text class="r" x="42" y="257" font-family="Georgia,serif" font-style="italic" font-size="88" letter-spacing="-3" fill="#2f55ff">S</text>
<text class="r" x="46" y="315" font-family="Arial,sans-serif" font-size="15" fill="#3a3a3c">I build full-stack products, explore AI,</text>
<text class="r" x="46" y="339" font-family="Arial,sans-serif" font-size="15" fill="#3a3a3c">and turn curious ideas into useful tools.</text>
<text x="46" y="390" font-family="monospace" font-size="11" fill="#111111">github.com/Akashsenthilkumar08</text>
